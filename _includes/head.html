<head>
<!-- 覆盖 Minima 默认 head.html (2.5.1)，用途：注入主题初始化脚本防止 FOUC -->
<!-- 升级 Minima 时需手动核对上游变更 -->
  <script>
    (function() {
      var theme;
      try {
        theme = localStorage.getItem('theme') || 'dark';
      } catch (error) {
        theme = 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://giscus.app" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"
          integrity="sha256-ieUctArvXa2Jaww7u+OyjqzBpOW04E9K17BzP8qrxVM="
          crossorigin="anonymous"></script>
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  {%- if site.vercount -%}
  <!-- 阅读量统计：Vercount（不蒜子替代方案，https://vercount.one），纯前端计数 -->
  <!-- 脚本已本地化到 assets/js/vercount.js：events.vercount.one 在国内直连常需 5-15s 甚至超时，
       远程加载脚本会拖慢首屏且偶发失败。本地副本仅把请求超时 5s 放宽为 25s，其余逻辑与上游一致。
       ⚠️ 上游脚本更新时需手动重新下载 https://events.vercount.one/js 并重新应用该超时修改。 -->
  <link rel="preconnect" href="https://events.vercount.one" crossorigin>
  <script defer src="{{ '/assets/js/vercount.js' | relative_url }}"></script>
  {%- endif -%}
</head>
